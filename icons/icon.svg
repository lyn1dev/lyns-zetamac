<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners (iOS icon mask friendly) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Math Symbol Grid: Plus, Minus, Times, Divide -->
  <g fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <!-- Top Left: Plus -->
    <rect x="156" y="100" width="20" height="72" rx="10" fill="#38bdf8"/>
    <rect x="130" y="126" width="72" height="20" rx="10" fill="#38bdf8"/>

    <!-- Top Right: Minus -->
    <rect x="310" y="126" width="72" height="20" rx="10" fill="#f43f5e"/>

    <!-- Bottom Left: Multiply -->
    <g transform="translate(166, 350) rotate(45)">
      <rect x="-10" y="-36" width="20" height="72" rx="10" fill="#fbbf24"/>
      <rect x="-36" y="-10" width="72" height="20" rx="10" fill="#fbbf24"/>
    </g>

    <!-- Bottom Right: Divide -->
    <circle cx="346" cy="316" r="11" fill="#34d399"/>
    <rect x="310" y="340" width="72" height="20" rx="10" fill="#34d399"/>
    <circle cx="346" cy="384" r="11" fill="#34d399"/>
  </g>

  <!-- Center Zetamac 'Z' Badge -->
  <circle cx="256" cy="256" r="54" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
  <text x="256" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Z</text>
</svg>
